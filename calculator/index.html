<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Calculator</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/ui.js"></script>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1 class="visually-hidden">Calculator</h1>
    <div class="screen">
      <div class="expression" id="expression" aria-label="Expression"></div>
      <output class="display" id="display" aria-live="polite" aria-atomic="true" aria-label="Result">0</output>
    </div>
    <div class="keys" id="keys">
      <button type="button" class="key fn" data-action="clear" aria-label="all clear">AC</button>
      <button type="button" class="key fn" data-action="backspace" aria-label="backspace">⌫</button>
      <button type="button" class="key fn" data-action="toggleSign" aria-label="toggle sign">±</button>
      <button type="button" class="key op" data-operator="/" aria-label="divide" aria-pressed="false">÷</button>

      <button type="button" class="key" data-digit="7">7</button>
      <button type="button" class="key" data-digit="8">8</button>
      <button type="button" class="key" data-digit="9">9</button>
      <button type="button" class="key op" data-operator="*" aria-label="multiply" aria-pressed="false">×</button>

      <button type="button" class="key" data-digit="4">4</button>
      <button type="button" class="key" data-digit="5">5</button>
      <button type="button" class="key" data-digit="6">6</button>
      <button type="button" class="key op" data-operator="-" aria-label="subtract" aria-pressed="false">−</button>

      <button type="button" class="key" data-digit="1">1</button>
      <button type="button" class="key" data-digit="2">2</button>
      <button type="button" class="key" data-digit="3">3</button>
      <button type="button" class="key op" data-operator="+" aria-label="add" aria-pressed="false">+</button>

      <button type="button" class="key fn" data-action="percent" aria-label="percent">%</button>
      <button type="button" class="key" data-digit="0">0</button>
      <button type="button" class="key" data-action="inputDecimal" aria-label="decimal point">.</button>
      <button type="button" class="key eq" data-action="equals" aria-label="equals">=</button>
    </div>
  </main>
</body>
</html>
